name: Verify Autonomous Agent Compliance

on:
  push:
    branches: [ main ]
  schedule:
    # Runs daily at midnight to verify oracle and DNS anchoring
    - cron: '0 0 * * *'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PROOF X-Ray Standard Compliance
        uses: ./
        with:
          domain: 'www.proofxray.com'
