name: 'PROOF Autonomous Enterprise Verifier'
description: "Verify a domain's PROOF-VC v2 certificate: pinned-key Ed25519 signature, certified flag and score threshold. Fails closed."
author: 'Arthur Mellin / PROOF X-Ray'

inputs:
  domain:
    description: 'Domain to verify (e.g. proofxray.com). The step fails if its PROOF-VC v2 certificate has no valid Ed25519 signature (checked against a key pinned in this action), is expired, is not marked certified, or scores below min_score.'
    required: true
  min_score:
    description: 'Minimum PROOF score (0 to 100) required for the step to succeed. The score is read from the signed certificate payload.'
    required: false
    default: '80'

outputs:
  status:
    description: 'CERTIFIED (valid signature, certified, score >= min_score), AUDITED (valid signature but not certified or below min_score) or UNVERIFIED (no certificate, no valid signature, expired, or mismatching fields). INVALID for malformed input.'
    value: ${{ steps.verify.outputs.status }}
  score:
    description: 'Score from the signed payload (0 to 100); empty when status is UNVERIFIED or INVALID.'
    value: ${{ steps.verify.outputs.score }}
  certified:
    description: "'true' only when status is CERTIFIED, otherwise 'false'."
    value: ${{ steps.verify.outputs.certified }}

runs:
  using: 'composite'
  steps:
    - name: Verify PROOF-VC v2 certificate
      id: verify
      shell: bash
      env:
        TARGET_DOMAIN: ${{ inputs.domain }}
        PROOF_MIN_SCORE: ${{ inputs.min_score }}
      run: |
        python3 "${GITHUB_ACTION_PATH}/bin/proof-verify.py" "$TARGET_DOMAIN"

branding:
  icon: 'shield'
  color: 'green'
